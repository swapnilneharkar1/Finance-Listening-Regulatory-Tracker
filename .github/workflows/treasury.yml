name: Treasury Peer Benchmarking

# Collects NBFC annual reports, extracts borrowing / investment figures and rebuilds
# data/treasury/benchmark.json for the portal's "Treasury Peer Benchmarking" dashboards.
# Separate from the hourly "Scrape Regulatory Data" workflow; only reports not processed
# before are downloaded, so weekly runs are quick once the history is in.
on:
  schedule:
    - cron: '0 * * * *'    # Mondays 01:30 UTC (07:00 IST)
  workflow_dispatch:
    inputs:
      force:
        description: "Re-extract every report (not just new ones)"
        type: boolean
        default: false
      only:
        description: "Only these companies, comma-separated keys (e.g. BFL,CHOLA). Blank = all"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: treasury-benchmarking
  cancel-in-progress: false

jobs:
  treasury:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # first run downloads ~5 annual reports per NBFC; later runs only new ones
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium system dependencies (for Puppeteer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0 libatk1.0-0 \
            libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 \
            libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 \
            libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 \
            libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 \
            lsb-release wget xdg-utils || true
      - name: Install dependencies
        working-directory: scraper
        run: |
          npm install
          # newer PDF reader for annual reports the bundled one can't open (not added to package.json)
          npm install --no-save pdfjs-dist@3.11.174
      - name: Collect annual reports and build benchmark
        working-directory: scraper
        env:
          TREASURY_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          TREASURY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only || '' }}
        run: node treasury.js
      - name: Commit results
        run: |
          git config user.name "regulatory-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- scraper/package-lock.json 2>/dev/null || true
          git add data/treasury
          if git diff --staged --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Update treasury benchmarking ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "Push failed (the hourly scraper may have pushed at the same time), retrying…"; sleep 10
          done
          exit 1
